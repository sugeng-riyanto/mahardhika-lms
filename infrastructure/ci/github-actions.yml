# AKADEMI Digital Campus - CI Pipeline
# Frontend: lint, typecheck, test, build, accessibility E2E
# Backend: lint, test, migration check
# Load: health endpoint throughput gate

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  accessibility:
    name: Accessibility E2E
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run accessibility tests
        run: npx playwright test e2e/accessibility.spec.ts --project=chromium
        env:
          CI: true

  e2e-flows:
    name: E2E Flow Tests
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E flow tests
        run: npx playwright test e2e/flows.spec.ts --project=chromium
        env:
          CI: true

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: akademi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/akademi_test
          DJANGO_SECRET_KEY: ci-test-secret-key
        run: pytest -v --tb=short

      - name: Migration check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/akademi_test
          DJANGO_SECRET_KEY: ci-test-secret-key
        run: python manage.py migrate --check --verbosity=0

  load-test:
    name: Load Test Gate
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Start Django server
        working-directory: backend
        run: |
          python manage.py migrate --verbosity=0
          python manage.py runserver 8000 --settings=config.settings_loadtest &
          sleep 5

      - name: Install autocannon
        working-directory: infrastructure/load-tests
        run: npm install

      - name: Run load tests
        working-directory: infrastructure/load-tests
        run: |
          node run.js --duration 10 --connections 10
        env:
          BASE_URL: http://localhost:8000
