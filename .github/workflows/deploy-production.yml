name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY" to confirm production deployment'
        required: true
      rollback_version:
        description: 'Rollback to previous version (leave empty for new deploy)'
        required: false
        default: ''

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ==========================================
  # Pre-flight checks
  # ==========================================
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm deployment
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "ERROR: You must type 'DEPLOY' to confirm production deployment"
            exit 1
          fi
          echo "✅ Production deployment confirmed"

      - name: Check branch
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [ "$BRANCH" != "main" ]; then
            echo "ERROR: Production deployments must be from main branch (current: $BRANCH)"
            exit 1
          fi
          echo "✅ Branch check passed (main)"

      - name: Check no uncommitted changes
        run: |
          if ! git diff --quiet; then
            echo "ERROR: Uncommitted changes detected"
            exit 1
          fi
          echo "✅ Working directory clean"

  # ==========================================
  # Backend: Test → Deploy to Railway
  # ==========================================
  deploy-backend:
    name: Deploy Backend to Production
    runs-on: ubuntu-latest
    needs: [preflight]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Run backend tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DATABASE_URL: "sqlite:///db.sqlite3"
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_SECRET_KEY: "placeholder"
          SUPABASE_PUBLISHABLE_KEY: "placeholder"
        run: |
          pip install -r requirements.txt
          python manage.py migrate --settings=config.settings
          python -m pytest --tb=short --quiet -x -q --timeout=60 -p no:warnings 2>&1 | tail -20

      - name: Deploy to Railway (production)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID_PROD }}
        run: |
          if [ -n "${{ github.event.inputs.rollback_version }}" ]; then
            echo "Rolling back to version: ${{ github.event.inputs.rollback_version }}"
            railway rollback --service akademi-api --environment production --version ${{ github.event.inputs.rollback_version }}
          else
            railway up --service akademi-api --environment production
          fi
          railway service logs --service akademi-api --environment production 2>&1 | tail -20

  # ==========================================
  # Frontend: Build → Deploy to Vercel
  # ==========================================
  deploy-frontend:
    name: Deploy Frontend to Production
    runs-on: ubuntu-latest
    needs: [preflight]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        env:
          VITE_API_URL: /api/v1
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_PROD }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY_PROD }}
        run: npm run build

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (production)
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PROD }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_PROD }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PROD }}
        run: |
          if [ -n "${{ github.event.inputs.rollback_version }}" ]; then
            echo "Rolling back to version: ${{ github.event.inputs.rollback_version }}"
            vercel rollback ${{ github.event.inputs.rollback_version }} --token=$VERCEL_TOKEN
          else
            vercel deploy --prod --token=$VERCEL_TOKEN --yes
          fi

  # ==========================================
  # Post-deploy: Health check
  # ==========================================
  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]

    steps:
      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Check backend health
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://akademi-api.up.railway.app/api/v1/health/ 2>/dev/null)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend healthy (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: Backend returned HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "❌ Backend health check failed after 3 attempts"
          exit 1

      - name: Check frontend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://akademi.vercel.app/ 2>/dev/null)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Frontend healthy (HTTP $STATUS)"
          else
            echo "⚠️ Frontend returned HTTP $STATUS (may still be deploying)"
          fi

  # ==========================================
  # Notification
  # ==========================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [preflight, deploy-backend, deploy-frontend, health-check]
    if: always()

    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.deploy-backend.result }}" = "success" ] && [ "${{ needs.deploy-frontend.result }}" = "success" ]; then
            echo "✅ Production deployment successful"
            echo "Backend: https://akademi-api.up.railway.app"
            echo "Frontend: https://akademi.vercel.app"
            echo "Deployed by: ${{ github.actor }}"
            echo "Commit: ${{ github.sha }}"
          else
            echo "❌ Production deployment failed"
            echo "Backend: ${{ needs.deploy-backend.result }}"
            echo "Frontend: ${{ needs.deploy-frontend.result }}"
            echo "Please check the logs and consider rollback"
            exit 1
          fi
