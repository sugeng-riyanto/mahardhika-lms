name: Deploy to Staging (Free Tier)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests before deploy'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ==========================================
  # Backend: Test → Deploy to Render
  # ==========================================
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: []

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run backend tests
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DATABASE_URL: "sqlite:///db.sqlite3"
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_SECRET_KEY: "placeholder"
          SUPABASE_PUBLISHABLE_KEY: "placeholder"
        run: |
          pip install -r requirements.txt
          python manage.py migrate --settings=config.settings
          python -m pytest --tb=short --quiet -x -q --timeout=60 -p no:warnings 2>&1 | tail -20

      - name: Deploy to Render
        uses: baconbridge/action-render-deploy@v2
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

  # ==========================================
  # Frontend: Build → Deploy to Cloudflare Pages
  # ==========================================
  deploy-frontend:
    name: Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: []

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: /api/v1
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=akademi

  # ==========================================
  # Post-deploy: Health check
  # ==========================================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]

    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check backend
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://akademi-api.onrender.com/api/v1/health/ 2>/dev/null)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend healthy"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying..."
            sleep 10
          done
          echo "⚠️ Backend may be cold-starting (30-50s on free tier)"

      - name: Check frontend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://akademi.pages.dev/ 2>/dev/null)
          echo "Frontend: HTTP $STATUS"

  # ==========================================
  # Notification
  # ==========================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()

    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.deploy-backend.result }}" = "success" ] && [ "${{ needs.deploy-frontend.result }}" = "success" ]; then
            echo "✅ Staging deployment successful (Free Tier)"
            echo "Backend: https://akademi-api.onrender.com"
            echo "Frontend: https://akademi.pages.dev"
          else
            echo "❌ Staging deployment failed"
            echo "Backend: ${{ needs.deploy-backend.result }}"
            echo "Frontend: ${{ needs.deploy-frontend.result }}"
          fi
