<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
  <style>
    body { margin: 0; padding: 0; background-color: #0a0f1e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .container { max-width: 600px; margin: 0 auto; background-color: #111827; }
    .header { background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%); padding: 24px 32px; text-align: center; }
    .header h1 { color: #ffffff; font-size: 20px; margin: 0; font-weight: 600; }
    .header p { color: rgba(255,255,255,0.8); font-size: 13px; margin: 4px 0 0 0; }
    .content { padding: 32px; color: #e5e7eb; font-size: 14px; line-height: 1.6; }
    .content h2 { color: #ffffff; font-size: 18px; margin: 0 0 16px 0; }
    .content p { margin: 0 0 12px 0; }
    .btn { display: inline-block; padding: 12px 24px; background-color: #06b6d4; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px; margin: 16px 0; }
    .card { background-color: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 16px; margin: 16px 0; }
    .footer { padding: 24px 32px; background-color: #111827; border-top: 1px solid #374151; text-align: center; color: #6b7280; font-size: 12px; }
    .footer a { color: #06b6d4; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎓 AKADEMI Digital Campus</h1>
      <p>Integrated Learning Management System</p>
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      <p>© 2026 AKADEMI Digital Campus. All rights reserved.</p>
      <p><a href="{{ settings.SITE_URL|default:'https://akademi.id' }}">akademi.id</a></p>
    </div>
  </div>
</body>
</html>
