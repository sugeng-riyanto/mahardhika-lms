services:
  - type: web
    name: akademi-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: akademi-api.onrender.com
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: akademi-db
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: mock
      - key: WHATSAPP_PROVIDER
        value: mock
      - key: PAYMENT_PROVIDER
        value: mock
      - key: SEED_PASSWORD
        value: changeme-production-2026
    healthCheckPath: /api/v1/health/
    autoDeploy: true

databases:
  - name: akademi-db
    plan: free
    databaseName: akademi
    ipAllowList: []
